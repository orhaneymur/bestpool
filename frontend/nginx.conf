server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA yönlendirmesi (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ASLA önbelleğe alınmamalı.
    # Vite her build'de asset adlarına yeni bir hash verir. Tarayıcı eski
    # index.html'i saklarsa artık var olmayan bir bundle'ı ister; aşağıdaki
    # kural olmadan SPA fallback devreye girip 200 + HTML döner, tarayıcı da
    # HTML'i JavaScript sanıp çalıştırmaya çalışır ve sayfa bembeyaz kalır.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hash'li dosyalar içerikleriyle birlikte adlandırıldığı için sonsuza kadar
    # önbelleklenebilir. Eksik bir asset SPA fallback'e DÜŞMEZ: sessiz beyaz
    # sayfa yerine dürüst bir 404 döner.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API isteklerini backend servisine yönlendir.
    # Kubernetes içinde "backend" servis adı; docker-compose'da da "backend".
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
}
