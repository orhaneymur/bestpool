# İzole üretim kurulumu.
# Bu stack'i her zaman kendi proje adıyla çalıştırın (diğer sitelerden izole olması için):
#   docker compose -p bestpool -f docker-compose.prod.yml up -d
# Böylece network, volume ve container isimleri "bestpool_" ön ekiyle ayrışır.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: havuz_teklif
      MYSQL_USER: havuz
      MYSQL_PASSWORD: ${DB_PASSWORD:-havuz_parola}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_parola}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bestpool_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_parola}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: since1907/bestpool-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: havuz_teklif
      DB_USER: havuz
      DB_PASSWORD: ${DB_PASSWORD:-havuz_parola}
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-degistirin-cok-gizli-anahtar}
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@havuz.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      ADMIN_NAME: Sistem Yoneticisi
    networks:
      - bestpool_net

  frontend:
    image: since1907/bestpool-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    # Sadece localhost'a ve benzersiz bir porta bağlanır; dışarıya reverse proxy üzerinden açılır.
    # Diğer 5 site ile port çakışmasını önlemek için BIND_IP=127.0.0.1 (varsayılan) bırakın.
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8090}:80"
    networks:
      - bestpool_net

networks:
  bestpool_net:
    name: bestpool_net

volumes:
  db_data:
    name: bestpool_db_data
