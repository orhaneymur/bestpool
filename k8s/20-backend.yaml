apiVersion: apps/v1
kind: Deployment
metadata:
  name: havuz-backend
  namespace: havuz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: havuz-backend
  template:
    metadata:
      labels:
        app: havuz-backend
    spec:
      containers:
        - name: backend
          # İmajı kendi registry'nize göre değiştirin:
          image: havuz-teklif-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: havuz-config }
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: havuz-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: havuz-secrets, key: JWT_SECRET } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: havuz-secrets, key: ADMIN_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            # Half a core could not render a contract and serve requests at
            # the same time; the request is unchanged in spirit, only the burst
            # ceiling moves. See deploy/k3s-pool.yaml.
            requests: { cpu: "100m", memory: "192Mi" }
            limits: { cpu: "1500m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  # nginx.conf "http://backend:4000" adresine proxy'ler; bu yüzden servis adı "backend".
  name: backend
  namespace: havuz
spec:
  selector:
    app: havuz-backend
  ports:
    - port: 4000
      targetPort: 4000
