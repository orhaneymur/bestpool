apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: havuz-mysql-pvc
  namespace: havuz
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: havuz-mysql
  namespace: havuz
spec:
  serviceName: havuz-mysql
  replicas: 1
  selector:
    matchLabels:
      app: havuz-mysql
  template:
    metadata:
      labels:
        app: havuz-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--default-authentication-plugin=mysql_native_password"]
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom: { configMapKeyRef: { name: havuz-config, key: DB_NAME } }
            - name: MYSQL_USER
              valueFrom: { configMapKeyRef: { name: havuz-config, key: DB_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: havuz-secrets, key: DB_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: havuz-secrets, key: MYSQL_ROOT_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: havuz-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: havuz-mysql
  namespace: havuz
spec:
  selector:
    app: havuz-mysql
  ports:
    - port: 3306
      targetPort: 3306
