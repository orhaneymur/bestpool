# bestpool için Nginx reverse proxy (alt alan adı, HTTP).
# Sunucuda kurulu (host) Nginx içindir. Diğer 5 sitenin config'ine DOKUNMAZ; ayrı bir server bloğudur.
#
# Kurulum (Debian/Ubuntu):
#   sudo cp deploy/nginx-bestpool.conf /etc/nginx/sites-available/bestpool.conf
#   sudo ln -s /etc/nginx/sites-available/bestpool.conf /etc/nginx/sites-enabled/bestpool.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# "teklif.sirketiniz.com" kısmını kendi alt alan adınızla değiştirin ve
# bu alt alan adının A kaydını sunucunun IP'sine yönlendirin.

server {
    listen 80;
    listen [::]:80;
    server_name teklif.sirketiniz.com;

    # docker-compose.prod.yml içinde frontend 127.0.0.1:8090'a bağlanıyor.
    # HTTP_PORT'u değiştirdiyseniz burayı da güncelleyin.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }
}
